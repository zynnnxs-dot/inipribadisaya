<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Reset Password — NDREXAN</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;
      padding:20px;background:#090909;color:#f5f5f5;
      font:16px/1.5 system-ui,sans-serif}
    main{width:min(440px,100%);padding:24px;
      background:#141414;border:1px solid #303030;border-radius:18px}
    h1{margin-top:0;font-size:28px}
    .red{color:#e33131}
    label{display:block;margin:16px 0 6px;color:#ccc;font-size:14px}
    input{width:100%;padding:12px;border-radius:10px;
      border:1px solid #393939;background:#090909;color:white;font:inherit}
    button{margin-top:18px;padding:12px 18px;border:0;
      border-radius:999px;background:#e33131;color:white;
      font-weight:700;cursor:pointer;width:100%}
    #msg{font-size:14px;overflow-wrap:anywhere}
    a{color:#ff7777}
  </style>
</head>
<body>
<main>
  <h1>ndrexan<span class="red">.</span></h1>
  <h2>Buat password baru</h2>
  <p>Masukkan password baru untuk akun admin kamu.</p>

  <form id="resetForm">
    <label for="password">Password baru</label>
    <input id="password" type="password" minlength="8"
      autocomplete="new-password" required>

    <label for="confirm">Ulangi password baru</label>
    <input id="confirm" type="password" minlength="8"
      autocomplete="new-password" required>

    <button type="submit">Simpan password baru</button>
  </form>

  <p id="msg" role="status" aria-live="polite"></p>
  <p><a href="/admin">Kembali ke login admin</a></p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(async()=>{
  const db=window.supabase.createClient(
    "https://wbvtxojsjmkvbbymvriv.supabase.co",
    "sb_publishable_7rH-1ZbGgb7FPb0eHFVziQ_Qna-BYFn"
  );
  const form=document.getElementById("resetForm");
  const msg=document.getElementById("msg");

  try{
    const {data,error}=await db.auth.getSession();
    if(error) throw error;
    if(!data.session){
      form.hidden=true;
      msg.textContent="Link reset tidak valid atau sudah kedaluwarsa. Minta link reset baru dari halaman admin.";
    }
  }catch(e){
    form.hidden=true;
    msg.textContent="Gagal memeriksa link reset: "+e.message;
  }

  form.addEventListener("submit",async e=>{
    e.preventDefault();
    const password=document.getElementById("password").value;
    const confirm=document.getElementById("confirm").value;

    if(password.length<8){
      msg.textContent="Password minimal 8 karakter.";
      return;
    }
    if(password!==confirm){
      msg.textContent="Kedua password tidak sama.";
      return;
    }

    msg.textContent="Menyimpan password...";
    const {error}=await db.auth.updateUser({password});
    if(error){
      msg.textContent="Gagal menyimpan: "+error.message;
      return;
    }

    await db.auth.signOut();
    form.hidden=true;
    msg.textContent="Password berhasil diubah. Silakan masuk melalui halaman admin.";
  });
})();
</script>
</body>
</html>
